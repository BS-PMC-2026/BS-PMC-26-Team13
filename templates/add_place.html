<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpot - Add Place</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #efedf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 700px;
      max-width: 100%;
      background: #f8f6fb;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      color: #a78bfa;
      margin-bottom: 10px;
      font-size: 42px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
      font-size: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      margin-top: 14px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: normal;
    }

    .checkbox-row input {
      width: auto;
      margin-right: 6px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #b49bf2;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .btn:hover {
      background: #9f7df0;
    }

    .flash-message {
      background: #ffe0e0;
      color: #900;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 350px;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid #ddd;
    }

    .map-note {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Add Place</h1>
    <p class="subtitle">Add your study place and send it for admin approval.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-message">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>Place Name</label>
      <input type="text" name="name" required>

      <label>Description</label>
      <textarea name="description"></textarea>

      <label>Area</label>
      <input type="text" name="area" value="Beersheba" required>

      <label>Service Type</label>
      <select name="service_type" required>
        <option value="">Select service type</option>
        <option value="Library">Library</option>
        <option value="Cafe">Cafe</option>
        <option value="Study Room">Study Room</option>
        <option value="Work Space">Work Space</option>
      </select>

      <label>Opening Hours</label>
      <input type="text" name="opening_hours" placeholder="08:00 - 22:00">

      <label>Select Place on Map</label>
      <div id="map"></div>
      <p class="map-note">Click on the map to choose the place location in Beersheba.</p>

      <label>Latitude</label>
      <input type="number" step="any" name="latitude" id="latitude" readonly required>

      <label>Longitude</label>
      <input type="number" step="any" name="longitude" id="longitude" readonly required>

      <div class="checkbox-row">
        <label><input type="checkbox" name="wifi"> WiFi</label>
        <label><input type="checkbox" name="printer"> Printer</label>
      </div>

      <button type="submit" class="btn">Add Place</button>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // خريطة متمركزة على بئر السبع
    var map = L.map('map').setView([31.2518, 34.7913], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker;

    map.on('click', function(e) {
      var lat = e.latlng.lat;
      var lng = e.latlng.lng;

      document.getElementById('latitude').value = lat.toFixed(6);
      document.getElementById('longitude').value = lng.toFixed(6);

      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.marker([lat, lng]).addTo(map);
    });
  </script>

</body>
</html>
