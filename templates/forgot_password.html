<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 90px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #1f3448;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #b7c3cc;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2d89c8;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #1f3448;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            background: #f2f2f2;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Reset Password</h1>
    <p>Enter your email and choose a new password.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>

        <label>New Password</label>
        <input type="password" name="new_password" placeholder="New password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm password" required>

        <button type="submit">Update Password</button>
    </form>

    <div class="back">
        <a href="{{ url_for('login') }}">Back to login</a>
    </div>
</div>

</body>
</html>
