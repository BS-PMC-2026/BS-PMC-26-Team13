<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudySpot - Users</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #dfe5e8;
      min-height: 100vh;
      padding: 35px;
      color: #2c3e50;
    }

    .container {
      width: 1200px;
      max-width: 100%;
      margin: auto;
      background: #ecf0f1;
      border-radius: 28px;
      padding: 55px 65px;
      box-shadow: 0 14px 35px rgba(44, 62, 80, 0.18);
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
      position: relative;
    }

    h1 {
      font-size: 72px;
      color: #2c3e50;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 20px;
      color: #7f8c8d;
    }

    .back-btn {
      position: absolute;
      left: 0;
      top: 20px;
      text-decoration: none;
      background: white;
      color: #2c3e50;
      border: 2px solid #2c3e50;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 18px;
    }

    .back-btn:hover {
      background: #2c3e50;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(44, 62, 80, 0.08);
    }

    th, td {
      padding: 18px 20px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
      font-size: 16px;
    }

    th {
      background: #2c3e50;
      color: white;
      font-size: 17px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .role {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 14px;
    }

    .student {
      background: #d6eaff;
      color: #21618c;
    }

    .owner {
      background: #fff3cd;
      color: #856404;
    }

    .admin {
      background: #d4edda;
      color: #155724;
    }

    .delete-btn {
      text-decoration: none;
      background: #e74c3c;
      color: white;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 14px;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .disabled {
      color: #7f8c8d;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .container {
        padding: 35px 22px;
      }

      h1 {
        font-size: 48px;
      }

      .back-btn {
        position: static;
        display: inline-block;
        margin-bottom: 25px;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <a href="{{ url_for('admin_dashboard') }}" class="back-btn">Back</a>

      <h1>Users</h1>
      <p class="subtitle">View and manage all registered users.</p>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        {% for user in users %}
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="role {{ user.role }}">
                {{ user.role.title() }}
              </span>
            </td>
            <td>
              {% if user.role != 'admin' %}
                <a href="{{ url_for('delete_user', user_id=user.id) }}"
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this user?');">
                  Delete
                </a>
              {% else %}
                <span class="disabled">Protected</span>
              {% endif %}
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

  </div>

</body>
</html>
