<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpot - View Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #efedf3;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 1100px;
      max-width: 100%;
      margin: auto;
      background: #f8f6fb;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      color: #a78bfa;
      font-size: 40px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #b49bf2;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
    }

    .btn:hover {
      background: #9f7df0;
    }

    #map {
      width: 100%;
      height: 550px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

    .empty-message {
      text-align: center;
      color: #777;
      font-size: 17px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Study Places Map</h1>
    <p class="subtitle">Explore approved study places in Beersheba.</p>

    <div class="top-actions">
      <a href="{{ url_for('student_dashboard') }}" class="btn">Back to Dashboard</a>
      <a href="{{ url_for('logout') }}" class="btn">Logout</a>
    </div>

    <div id="map"></div>

    {% if not places %}
      <p class="empty-message">No approved places available yet.</p>
    {% endif %}
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([31.2518, 34.7913], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var places = [
      {% for place in places %}
        {
          name: {{ place.name|tojson }},
          description: {{ (place.description or 'No description')|tojson }},
          area: {{ place.area|tojson }},
          service_type: {{ place.service_type|tojson }},
          opening_hours: {{ (place.opening_hours or 'Not specified')|tojson }},
          wifi: {{ 'Yes' if place.wifi else 'No'|tojson }},
          printer: {{ 'Yes' if place.printer else 'No'|tojson }},
          latitude: {{ place.latitude }},
          longitude: {{ place.longitude }}
        }{% if not loop.last %},{% endif %}
      {% endfor %}
    ];

    places.forEach(function(place) {
      L.marker([place.latitude, place.longitude]).addTo(map)
        .bindPopup(
          "<b>" + place.name + "</b><br>" +
          "Description: " + place.description + "<br>" +
          "Area: " + place.area + "<br>" +
          "Type: " + place.service_type + "<br>" +
          "Opening Hours: " + place.opening_hours + "<br>" +
          "WiFi: " + place.wifi + "<br>" +
          "Printer: " + place.printer
        );
    });
  </script>

</body>
</html>
