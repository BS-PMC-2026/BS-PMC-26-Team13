<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpot - View Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #efedf3;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 1100px;
      max-width: 100%;
      margin: auto;
      background: #f8f6fb;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      color: #a78bfa;
      font-size: 40px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #b49bf2;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
    }

    .btn:hover {
      background: #9f7df0;
    }

    #map {
      width: 100%;
      height: 550px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

    .empty-message {
      text-align: center;
      color: #777;
      font-size: 17px;
      margin-top: 20px;
    }
    .filter-box {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-box label {
  font-weight: bold;
  color: #555;
}

.filter-box select {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 15px;
  background: white;
}

.filter-box button {
  padding: 10px 18px;
  border: none;
  border-radius: 12px;
  background: #b49bf2;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.filter-box button:hover {
  background: #9f7df0;
}
  </style>
</head>
<body>

  <div class="container">
    <h1>Study Places Map</h1>
    <p class="subtitle">Explore approved study places in Beersheba.</p>

    <div class="top-actions">
      <a href="{{ url_for('student_dashboard') }}" class="btn">Back to Dashboard</a>
      <a href="{{ url_for('logout') }}" class="btn">Logout</a>
    </div>
<form method="GET" class="filter-box">
  <label>Filter by Area</label>

  <select name="area">
    <option value="all">All Areas</option>

    {% for area in areas %}
      <option value="{{ area }}" {% if selected_area == area %}selected{% endif %}>
        {{ area }}
      </option>
    {% endfor %}
  </select>

  <button type="submit">Apply Filter</button>
</form>
    <div id="map"></div>

    {% if not places %}
      <p class="empty-message">No approved places available yet.</p>
    {% endif %}
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([31.2518, 34.7913], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var places = {{ places_data | tojson }};

  places.forEach(function(place) {
    L.marker([place.latitude, place.longitude]).addTo(map)
      .bindPopup(
        "<b>" + place.name + "</b><br>" +
        "Description: " + place.description + "<br>" +
        "Area: " + place.area + "<br>" +
        "Type: " + place.service_type + "<br>" +
        "Opening Hours: " + place.opening_hours + "<br>" +
        "WiFi: " + place.wifi + "<br>" +
        "Printer: " + place.printer
      );
  });
</script>

</body>
</html>
